stem_contract:
  resources_servers:
    stem_judge:
      judge_model_revision: ${oc.env:STEM_JUDGE_MODEL_REVISION}
      verified: false
judge_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${oc.env:STEM_JUDGE_BASE_URL}
      api_key: ${oc.env:STEM_JUDGE_API_KEY}
      model: private/nemotron/deepseek-ai/deepseek-v4_1-flash
      return_token_id_information: false
      uses_reasoning_parser: true
      max_num_tries: 1
      refit_output_budget_to_window: false
